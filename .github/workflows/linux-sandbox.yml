name: Linux worker sandbox (#47)

# Validates that the LOCAL run loop sandboxes the untrusted candidate worker by
# default on Linux (issue #47): bubblewrap namespaces, the grader per-worker
# boundary, and an end-to-end POC where a malicious order() is blocked by default
# and only exfiltrates under the explicit opt-out. The runner is already Linux,
# so bubblewrap runs natively — no container is needed here (the Docker path in
# ci/linux-sandbox-check.docker.sh is only for non-Linux dev hosts).

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux-sandbox:
    # Evaluated before a runner is assigned, so fork PRs consume no minutes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install bubblewrap + prlimit
        run: |
          set -euo pipefail
          sudo apt-get update
          # util-linux provides prlimit; local Linux runs now require it (the
          # per-worker resource caps merged from #55) and fail closed without it.
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux
          bwrap --version
          prlimit --version | head -1

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # stops bubblewrap from configuring loopback in its --unshare-net namespace.
      # Relax it so the unprivileged worker sandbox can create its namespaces.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned cargo-deny (purity/license gate)
        run: cargo install cargo-deny --version 0.20.2 --locked

      # Vendor the dependency tree and generate manifests so the check builds
      # --offline --locked (the only networked step, same as pr-security.yml).
      - name: Prepare locked offline tree
        run: bash scripts/prepare-build.sh

      - name: Validate the local worker sandbox
        run: bash ci/linux-sandbox-check.sh
