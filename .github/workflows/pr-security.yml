name: PR security regressions

on:
  pull_request:

permissions:
  contents: read

jobs:
  security-regressions:
    # This job-level guard is evaluated before a runner is assigned. Fork PRs
    # therefore create only a skipped check and consume no runner minutes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Prepare locked offline tree
        run: bash scripts/prepare-build.sh

      - name: Check formatting on changed Rust lines
        run: python3 .github/scripts/check-rustfmt-diff.py "${{ github.event.pull_request.base.sha }}"

      - name: Test purity policy offline
        run: cargo test --locked --offline -p ssi-purity

      - name: Test watchdog process isolation offline
        run: cargo test --locked --offline --bin ssi-ordering-challenge watchdog::tests

      - name: Test enforced time cap offline
        run: cargo test --release --locked --offline --test time_cap
