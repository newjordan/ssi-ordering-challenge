name: CI

# Pull-request and main-branch tests. This workflow does not grade a
# submission and does not read the eval-corpus secrets. The dispatch-only
# benchmark workflow remains the grader.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The development corpus is Git LFS. Tests that need the resolved
          # blob skip when this checkout still has the pointer.
          lfs: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Prepare locked offline tree
        run: bash scripts/prepare-build.sh

      - name: Check formatting of new and previously formatted Rust
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check-rustfmt-diff.py "${{ github.event.pull_request.base.sha }}"

      # cargo test builds test harnesses. The time-cap integration test also
      # spawns the candidate bin, which `cargo test` does not copy into the
      # profile directory on the pinned toolchain. Build bins first.
      - name: Build workspace binaries
        run: cargo build --offline --locked --workspace --bins

      - name: Test
        run: cargo test --offline --locked --workspace
